<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Entrar — Portal de Representantes | Cardápio Web</title>
    <meta name="description" content="Acesse o Portal de Representantes da Cardápio Web — acompanhe seus clientes, comissões e sua jornada como parceiro.">
    <meta name="application-name" content="Portal de Representantes Cardápio Web">
    <meta name="theme-color" content="#5b21b6">

    <link rel="icon" type="image/jpeg" href="/assets/cw-logo-dark-e78e4446.jpg">
    <link rel="apple-touch-icon" href="/assets/cw-logo-dark-e78e4446.jpg">

    <link rel="stylesheet" href="/assets/application-cc2f1a53.css" />
  </head>

  <body class="auth-page">
    <script>
      // Login desativado temporariamente (2026-09-12) — pula direto pro dashboard.
      // Para reativar: apague este bloco <script>.
      sessionStorage.setItem('cw_test_authorized', '1');
      window.location.replace('/dashboard.html');
    </script>
    <div class="auth-card">
      <div class="auth-logo">
        <img alt="Cardápio Web" src="/assets/cw-logo-ee22739a.webp" />
      </div>

      <h2 class="auth-title">Bem-vindo de volta!</h2>
      <p class="auth-subtitle">Faça login para acessar o CRM</p>

      <form class="auth-form" id="new_user" onsubmit="return handleTestLogin(event);">
        <div class="field">
          <label for="user_email">E-mail</label>
          <input autofocus="autofocus" autocomplete="email" placeholder="seu@email.com" type="email" value="" name="user[email]" id="user_email" />
        </div>
        <div id="login-error" style="display:none; color:#dc2626; font-size:.82rem; margin:-8px 0 12px;">
          E-mail ou senha inválidos.
        </div>

        <div class="field">
          <label for="user_password">Senha</label>
          <div class="password-input-wrap">
            <input autocomplete="current-password" placeholder="••••••••" id="user_password" type="password" name="user[password]" />
            <button type="button" class="password-toggle" onclick="togglePassword()" title="Ver senha" tabindex="-1">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div class="auth-remember">
          <label>
            <input type="checkbox" value="1" name="user[remember_me]" id="user_remember_me" />
            Lembrar de mim
          </label>
          <a href="#" onclick="return false;">Esqueceu a senha?</a>
        </div>

        <input type="submit" name="commit" value="Entrar" class="btn-auth-submit" />
      </form>
      <div class="auth-divider">
        <span>ou continue com</span>
      </div>

      <button class="btn-google" type="button" onclick="alert('Login com Google indisponível no momento.');">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Entrar com Google
      </button>
      <div class="auth-footer" style="text-align: center; color: var(--cw-gray-500); font-size: 0.82rem;">
        Acesso restrito. Solicite suas credenciais ao administrador.
      </div>
    </div>

    <script>
      function togglePassword() {
        var input = document.getElementById('user_password');
        var eyeOn  = document.getElementById('eyeIcon');
        var eyeOff = document.getElementById('eyeOffIcon');
        var showing = input.type === 'text';
        input.type       = showing ? 'password' : 'text';
        eyeOn.style.display  = showing ? '' : 'none';
        eyeOff.style.display = showing ? 'none' : '';
      }

      var ALLOWED_EMAIL = 'gabrielly.oliveira@cardapioweb.com';

      function handleTestLogin(event) {
        event.preventDefault();
        var email = document.getElementById('user_email').value.trim().toLowerCase();
        var errorBox = document.getElementById('login-error');
        if (email === ALLOWED_EMAIL) {
          sessionStorage.setItem('cw_test_authorized', '1');
          window.location.href = '/dashboard.html';
        } else {
          errorBox.style.display = 'block';
        }
        return false;
      }
    </script>
  </body>
</html>
