<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Metas — Portal de Representantes | Cardápio Web</title>
    <link rel="icon" type="image/jpeg" href="/assets/cw-logo-dark-e78e4446.jpg">
    <link rel="stylesheet" href="/assets/application-cc2f1a53.css" />
    <style>
      @keyframes mt-fade-up { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

      /* ── Hero ── */
      .mt-hero { position:relative; overflow:hidden; border-radius:26px; padding:30px 32px; margin-bottom:18px;
        background:linear-gradient(135deg,#9d4dff 0%,#7c3aed 45%,#4c1d95 100%);
        box-shadow:0 22px 50px -12px rgba(109,40,217,.55); color:#fff; }
      .mt-hero::before { content:''; position:absolute; top:-90px; right:-60px; width:260px; height:260px; border-radius:50%;
        background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%); pointer-events:none; }
      .mt-hero::after { content:''; position:absolute; bottom:-120px; left:20%; width:280px; height:280px; border-radius:50%;
        background:radial-gradient(circle,rgba(255,182,0,.18),transparent 70%); pointer-events:none; }
      .mt-hero-inner { position:relative; z-index:1; }
      .mt-hero-top { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
      .mt-hero-badge { display:inline-flex; align-items:center; gap:6px; font-size:.72rem; font-weight:800; letter-spacing:.03em;
        background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28); color:#fff; padding:7px 14px; border-radius:999px;
        backdrop-filter:blur(4px); }
      .mt-hero-actions { display:flex; gap:10px; flex-wrap:wrap; }
      .mt-btn-ghost { display:inline-flex; align-items:center; gap:7px; font-size:.82rem; font-weight:700; color:#fff;
        background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.32); border-radius:12px; padding:9px 16px; cursor:pointer;
        transition:background-color .15s ease, transform .15s ease; }
      .mt-btn-ghost:hover { background:rgba(255,255,255,.24); transform:translateY(-1px); }
      .mt-btn-solid { display:inline-flex; align-items:center; gap:7px; font-size:.82rem; font-weight:800; color:#fff;
        background:linear-gradient(135deg,#ff6b6b,#ff5959); border:none; border-radius:12px; padding:9px 18px; cursor:pointer;
        box-shadow:0 10px 22px rgba(255,89,89,.45); transition:transform .15s ease, box-shadow .15s ease; }
      .mt-btn-solid:hover { transform:translateY(-1px); box-shadow:0 12px 26px rgba(255,89,89,.55); }
      .mt-hero-title { margin:0 0 6px; font-size:clamp(1.7rem,3.4vw,2.3rem); font-weight:900; letter-spacing:-.02em; line-height:1.1; }
      .mt-hero-sub { margin:0 0 22px; font-size:.92rem; color:rgba(255,255,255,.82); font-weight:500; max-width:520px; }
      .mt-hero-progress-row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
      .mt-hero-progress-label { font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:rgba(255,255,255,.72); }
      .mt-hero-progress-pct { font-size:1rem; font-weight:900; color:#fff; }
      .mt-hero-track { height:11px; background:rgba(255,255,255,.22); border-radius:999px; overflow:hidden; }
      .mt-hero-fill { height:100%; border-radius:999px; background:linear-gradient(90deg,#FFE27A,#FFB600); width:0%; transition:width 1s cubic-bezier(.22,.9,.3,1); }

      /* ── Tira de KPIs ── */
      .mt-kpis { display:flex; background:#fff; border-radius:18px; box-shadow:0 6px 20px rgba(89,50,122,.08); margin-bottom:22px; overflow:hidden; flex-wrap:wrap; }
      .mt-kpi { flex:1 1 150px; display:flex; align-items:center; gap:11px; padding:16px 18px; border-right:1px solid #f0edf6; }
      .mt-kpi:last-child { border-right:none; }
      .mt-kpi-ico { width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
      .mt-kpi-label { font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:#9ca3af; display:block; }
      .mt-kpi-value { font-size:1.02rem; font-weight:800; color:#17123b; display:block; }

      /* ── Grid de cartões ── */
      .mt-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; }
      .mt-card { background:#fff; border:1px solid #f0edf6; border-radius:20px; padding:20px 22px; box-shadow:0 4px 16px rgba(89,50,122,.06);
        transition:transform .18s ease, box-shadow .18s ease; animation:mt-fade-up .35s ease backwards; }
      .mt-card:hover { transform:translateY(-3px); box-shadow:0 14px 30px rgba(89,50,122,.14); }
      .mt-card-head { display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; }
      .mt-avatar { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#8b5cf6,#5b21b6); color:#fff;
        display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; flex-shrink:0; }
      .mt-card-headtext { display:flex; flex-direction:column; flex:1; min-width:100px; }
      .mt-card-name { font-weight:800; font-size:.96rem; color:#17123b; }
      .mt-card-role { font-size:.72rem; color:#9ca3af; font-weight:600; }
      .mt-card-current { text-align:right; display:flex; align-items:flex-start; gap:8px; }
      .mt-card-current-num { display:block; font-size:1.7rem; font-weight:900; color:#5b21b6; line-height:1.1; }
      .mt-card-current-label { font-size:.64rem; color:#9ca3af; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
      .mt-edit-btn { width:28px; height:28px; border-radius:8px; border:1px solid #eee; background:#faf9fc; color:#8b7a98; cursor:pointer;
        display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background-color .12s ease, color .12s ease; }
      .mt-edit-btn:hover { background:#f3efff; color:#6d28d9; }
      .mt-metric-pill { display:inline-flex; font-size:.72rem; font-weight:700; color:#6d28d9; background:#f3efff; border:1px solid #e9defb;
        padding:4px 11px; border-radius:999px; margin-bottom:16px; }
      .mt-track { position:relative; height:14px; background:#f4f2fb; border-radius:999px; margin:0 0 30px; }
      .mt-fill { position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:linear-gradient(90deg,#6d28d9,#a855f7); width:0%; transition:width .9s cubic-bezier(.22,.9,.3,1); }
      .mt-tick { position:absolute; top:-3px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; }
      .mt-tick-line { width:2px; height:20px; background:#dcd2f0; border-radius:2px; }
      .mt-tick.done .mt-tick-line { background:#10b981; }
      .mt-tick-label { margin-top:4px; font-size:.63rem; font-weight:700; color:#8b7a98; text-align:center; white-space:nowrap; }
      .mt-tick.done .mt-tick-label { color:#059669; }
      .mt-proj-marker { position:absolute; top:-13px; width:0; height:0; transform:translateX(-50%); border-left:5px solid transparent;
        border-right:5px solid transparent; border-bottom:9px solid #FF5959; filter:drop-shadow(0 2px 3px rgba(255,89,89,.4)); }
      .mt-tiers { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
      .mt-tier { font-size:.74rem; font-weight:700; color:#8b7a98; background:#f9f8fb; border:1px solid #eee; border-radius:999px; padding:5px 12px; }
      .mt-tier.done { color:#059669; background:#ecfdf5; border-color:#a7f3d0; }
      .mt-status { display:flex; align-items:flex-start; gap:7px; font-size:.82rem; color:#4b5563; line-height:1.5; padding-top:12px; border-top:1px dashed #eee; }
      .mt-status strong { color:#17123b; }
      .mt-status.ok { color:#059669; }
      .mt-pace-tag { display:inline-block; font-size:.66rem; font-weight:800; border-radius:6px; padding:2px 7px; margin-left:2px; white-space:nowrap; }
      .mt-pace-tag.ok { color:#059669; background:#ecfdf5; }
      .mt-pace-tag.bad { color:#dc2626; background:#fef2f2; }
      .mt-empty { font-size:.85rem; color:#9ca3af; background:#fff; border:1px dashed #e4dcfb; border-radius:20px; padding:24px; margin:0; text-align:center; }

      .mt-add-card { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center;
        border:2px dashed #e4dcfb; border-radius:20px; padding:30px 20px; cursor:pointer; background:#fbfaff;
        transition:background-color .15s ease, border-color .15s ease; min-height:180px; animation:mt-fade-up .35s ease backwards; }
      .mt-add-card:hover { background:#f3efff; border-color:#c9b6f2; }
      .mt-add-plus { width:46px; height:46px; border-radius:50%; background:#f3efff; color:#6d28d9; font-size:22px; font-weight:800;
        display:flex; align-items:center; justify-content:center; }
      .mt-add-title { font-weight:800; color:#17123b; font-size:.92rem; }
      .mt-add-sub { font-size:.76rem; color:#9ca3af; }

      .mt-footer-quote { text-align:center; font-size:.82rem; color:#8b7a98; font-weight:600; margin-top:22px; padding-top:18px; border-top:1px solid #f0edf6; }

      @media (max-width:640px) {
        .mt-hero { padding:24px 20px; }
        .mt-card-current { text-align:left; }
        .mt-kpi { flex:1 1 46%; border-right:none; border-bottom:1px solid #f0edf6; }
      }

      /* ── Modal de edição ── */
      .mt-form-block { margin-bottom:22px; }
      .mt-form-block-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
      .mt-form-block-head h3 { margin:0; font-size:.9rem; color:#17123b; }
      .mt-add-person { font-size:.76rem; font-weight:700; color:#6d28d9; background:#f3efff; border:1px solid #e4dcfb; border-radius:8px; padding:6px 12px; cursor:pointer; }
      .mt-add-person:hover { background:#e9defb; }
      .mt-person-row { display:grid; grid-template-columns:1.6fr .8fr .8fr .8fr .8fr auto; gap:8px; align-items:center; margin-bottom:8px; }
      .mt-person-row .form-input { padding:8px 10px; font-size:.82rem; }
      .mt-remove-person { width:32px; height:32px; border-radius:8px; border:1px solid #fecaca; background:#fff5f5; color:#dc2626; cursor:pointer; flex-shrink:0; }
      .mt-remove-person:hover { background:#fee2e2; }
      .mt-person-row-labels { display:grid; grid-template-columns:1.6fr .8fr .8fr .8fr .8fr auto; gap:8px; margin-bottom:6px; }
      .mt-person-row-labels span { font-size:.65rem; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:#9ca3af; }
      @media (max-width:640px) { .mt-person-row, .mt-person-row-labels { grid-template-columns:1fr; } .mt-person-row-labels { display:none; } }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="main-wrapper">
        <header class="top-header" id="top-header"></header>
        <main class="page-content">

          <div class="mt-hero">
            <div class="mt-hero-inner">
              <div class="mt-hero-top">
                <span class="mt-hero-badge">🔥 Seu mês em movimento</span>
                <div class="mt-hero-actions">
                  <button type="button" class="mt-btn-ghost" id="mt-gear">⚙️ Configurar</button>
                  <button type="button" class="mt-btn-solid" id="mt-add-top">+ Adicionar pessoa</button>
                </div>
              </div>
              <h2 class="mt-hero-title">Minhas metas</h2>
              <p class="mt-hero-sub" id="mt-hero-sub"></p>
              <div class="mt-hero-progress-row">
                <span class="mt-hero-progress-label">Progresso geral da Meta 1</span>
                <span class="mt-hero-progress-pct" id="mt-hero-pct">0%</span>
              </div>
              <div class="mt-hero-track"><div class="mt-hero-fill" id="mt-hero-fill"></div></div>
            </div>
          </div>

          <div class="mt-kpis" id="mt-kpis"></div>

          <div class="mt-grid" id="mt-grid"></div>

          <p class="mt-footer-quote">Um passo por dia também é progresso. Continue avançando. →</p>
        </main>
      </div>
    </div>

    <div class="modal-overlay" id="mt-modal">
      <div class="modal-content" style="max-width:660px;">
        <button type="button" class="modal-close" id="mt-modal-close">✕</button>
        <div class="modal-header-card"><h2>Editar metas do mês</h2></div>
        <form id="mt-form">
          <div class="form-grid" style="margin-bottom:20px;">
            <div class="form-group"><label>Mês de referência</label><input type="text" class="form-input" id="mt-f-mes" placeholder="Ex: Setembro/2026"></div>
            <div class="form-group"><label>Dia atual</label><input type="number" min="1" max="31" class="form-input" id="mt-f-dia"></div>
            <div class="form-group form-col-2"><label>Dias no mês</label><input type="number" min="28" max="31" class="form-input" id="mt-f-diasmes"></div>
          </div>

          <div class="mt-form-block">
            <div class="mt-form-block-head"><h3>CA — Cadastro de Representantes</h3><button type="button" class="mt-add-person" data-grupo="0">+ pessoa</button></div>
            <div class="mt-person-row-labels"><span>Nome</span><span>Atual</span><span>Meta 1</span><span>Meta 2</span><span>Meta 3</span><span></span></div>
            <div id="mt-f-people-0"></div>
          </div>

          <div class="mt-form-block">
            <div class="mt-form-block-head"><h3>PSM — Ativação de Representantes</h3><button type="button" class="mt-add-person" data-grupo="1">+ pessoa</button></div>
            <div class="mt-person-row-labels"><span>Nome</span><span>Atual</span><span>Meta 1</span><span>Meta 2</span><span>Meta 3</span><span></span></div>
            <div id="mt-f-people-1"></div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-outline" id="mt-restore">Restaurar padrão</button>
            <button type="submit" class="btn-primary">Salvar metas</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/assets/shell.js" data-title="Metas"></script>
    <script>
      var STORAGE_KEY = 'cw_metas_config_v1';

      // ── Valores padrão — usados na primeira visita e no "Restaurar padrão" ──
      // "atual" hoje vem dos mesmos números fictícios usados no gráfico do Dashboard
      // (Novos Reps / Reps Ativados de set/26); não há integração real ainda.
      var DEFAULT_CONFIG = {
        mesRef: 'Setembro/2026',
        diaAtual: 14,
        diasNoMes: 30,
        grupos: [
          {
            papel: 'CA', papelNome: 'Aquisição de Canal', metrica: 'Cadastro de Representantes',
            pessoas: [ { nome: 'Gabi Oliveira', atual: 11, metas: [39, 42, 45] } ]
          },
          {
            papel: 'PSM', papelNome: 'Sucesso de Parceiros', metrica: 'Ativação de Representantes',
            pessoas: [ { nome: 'Bea Andrade', atual: 1, metas: [4, 7, 10] } ]
          }
        ]
      };

      function cloneDefault() { return JSON.parse(JSON.stringify(DEFAULT_CONFIG)); }

      function loadConfig() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        return cloneDefault();
      }
      function saveConfig(cfg) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); } catch (e) {}
      }

      var config = loadConfig();

      function initials(name) {
        return (name || '?').split(' ').slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();
      }

      function allPairs() {
        var pairs = [];
        config.grupos.forEach(function (g) { g.pessoas.forEach(function (p) { pairs.push({ g: g, p: p }); }); });
        return pairs;
      }

      function animateNumber(el, to, suffix) {
        var from = 0, dur = 700, start = null;
        function step(ts) {
          if (!start) start = ts;
          var t = Math.min(1, (ts - start) / dur);
          var eased = 1 - Math.pow(1 - t, 3);
          var val = Math.round(from + (to - from) * eased);
          el.textContent = val + (suffix || '');
          if (t < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      function renderPessoa(grupo, p, idx) {
        var maxMeta = p.metas[2];
        var scale = Math.max(maxMeta, p.atual, 1) * 1.1;
        var fillPct = Math.min(100, (p.atual / scale) * 100);
        var projecao = Math.round((p.atual / config.diaAtual) * config.diasNoMes);
        var projPct = Math.min(100, (projecao / scale) * 100);

        var ticksHtml = p.metas.map(function (m, i) {
          var left = (m / scale) * 100;
          var done = p.atual >= m;
          return '<div class="mt-tick' + (done ? ' done' : '') + '" style="left:' + left + '%">' +
            '<span class="mt-tick-line"></span><span class="mt-tick-label">Meta ' + (i + 1) + '<br>' + m + '</span></div>';
        }).join('');

        var tiersHtml = p.metas.map(function (m, i) {
          var done = p.atual >= m;
          return '<span class="mt-tier' + (done ? ' done' : '') + '">' + (done ? '✅' : '⚪') + ' Meta ' + (i + 1) + ' — ' + m + '</span>';
        }).join('');

        var nextMeta = null, nextIdx = -1;
        for (var i = 0; i < p.metas.length; i++) {
          if (p.atual < p.metas[i]) { nextMeta = p.metas[i]; nextIdx = i; break; }
        }
        var paceOk = projecao >= p.metas[0];
        var statusHtml;
        if (nextMeta === null) {
          statusHtml = '<div class="mt-status ok">🏆 <span>Todas as metas do mês batidas!</span></div>';
        } else {
          var falta = nextMeta - p.atual;
          statusHtml = '<div class="mt-status"><span>📈</span><span>Faltam <strong>' + falta + '</strong> pra bater a Meta ' + (nextIdx + 1) + ' (' + nextMeta + '). ' +
            'Ritmo atual: ~<strong>' + projecao + '</strong> até o fim do mês' +
            '<span class="mt-pace-tag ' + (paceOk ? 'ok' : 'bad') + '">' + (paceOk ? 'no ritmo da Meta 1' : 'abaixo da Meta 1') + '</span></span></div>';
        }

        return '<div class="mt-card" style="animation-delay:' + (idx * 60) + 'ms">' +
          '<div class="mt-card-head">' +
            '<span class="mt-avatar">' + initials(p.nome) + '</span>' +
            '<div class="mt-card-headtext"><span class="mt-card-name">' + p.nome + '</span>' +
            '<span class="mt-card-role">' + grupo.papel + ' · ' + grupo.papelNome + '</span></div>' +
            '<div class="mt-card-current">' +
              '<div><span class="mt-card-current-num mt-count" data-to="' + p.atual + '">0</span><span class="mt-card-current-label">até agora</span></div>' +
              '<button type="button" class="mt-edit-btn" title="Editar" onclick="openModal()">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>' +
              '</button>' +
            '</div>' +
          '</div>' +
          '<span class="mt-metric-pill">' + grupo.metrica + '</span>' +
          '<div class="mt-track">' +
            '<div class="mt-fill" data-w="' + fillPct + '"></div>' +
            '<div class="mt-proj-marker" style="left:' + projPct + '%" title="Projeção pro fim do mês: ' + projecao + '"></div>' +
            ticksHtml +
          '</div>' +
          '<div class="mt-tiers">' + tiersHtml + '</div>' +
          statusHtml +
        '</div>';
      }

      function render() {
        var pairs = allPairs();

        document.getElementById('mt-hero-sub').textContent = pairs.length
          ? 'Cada número conta. Continue de olho no ritmo do time em ' + config.mesRef + '.'
          : 'Adicione as primeiras pessoas pra começar a acompanhar o mês.';

        var overallPct = 0;
        if (pairs.length) {
          var sum = 0;
          pairs.forEach(function (pr) { sum += Math.min(1, pr.p.atual / pr.p.metas[0]); });
          overallPct = Math.round((sum / pairs.length) * 100);
        }
        animateNumber(document.getElementById('mt-hero-pct'), overallPct, '%');
        requestAnimationFrame(function () {
          document.getElementById('mt-hero-fill').style.width = Math.min(100, overallPct) + '%';
        });

        var noRitmo = 0;
        pairs.forEach(function (pr) {
          var proj = Math.round((pr.p.atual / config.diaAtual) * config.diasNoMes);
          if (proj >= pr.p.metas[0]) noRitmo++;
        });

        document.getElementById('mt-kpis').innerHTML = [
          ['#f3efff', '#6d28d9', '📅', 'Período', config.mesRef],
          ['#fef2f2', '#dc2626', '🎯', 'Dia atual', config.diaAtual + ' de ' + config.diasNoMes],
          ['#f3efff', '#6d28d9', '👥', 'Pessoas', pairs.length + ' acompanhadas'],
          ['#ecfdf5', '#059669', '📈', 'No ritmo', noRitmo + ' de ' + pairs.length]
        ].map(function (k) {
          return '<div class="mt-kpi"><span class="mt-kpi-ico" style="background:' + k[0] + ';color:' + k[1] + ';">' + k[2] + '</span>' +
            '<div><span class="mt-kpi-label">' + k[3] + '</span><span class="mt-kpi-value">' + k[4] + '</span></div></div>';
        }).join('');

        var cardsHtml = pairs.map(function (pr, i) { return renderPessoa(pr.g, pr.p, i); }).join('');
        cardsHtml += '<div class="mt-add-card" id="mt-add-card" style="animation-delay:' + (pairs.length * 60) + 'ms">' +
          '<span class="mt-add-plus">+</span><span class="mt-add-title">Adicionar uma nova pessoa</span>' +
          '<span class="mt-add-sub">Crie uma meta e acompanhe o progresso</span></div>';
        var emptyMsg = pairs.length ? '' : '<p class="mt-empty">Nenhuma pessoa cadastrada ainda. Clique em "+ Adicionar pessoa" pra começar.</p>';
        document.getElementById('mt-grid').innerHTML = emptyMsg + cardsHtml;

        document.getElementById('mt-add-card').addEventListener('click', openModal);
        document.querySelectorAll('.mt-count').forEach(function (el) { animateNumber(el, Number(el.getAttribute('data-to'))); });
        requestAnimationFrame(function () {
          document.querySelectorAll('.mt-fill[data-w]').forEach(function (el) { el.style.width = el.getAttribute('data-w') + '%'; });
        });
      }
      render();

      // ── Modal de edição ──
      var modal = document.getElementById('mt-modal');
      var closeBtn = document.getElementById('mt-modal-close');
      var form = document.getElementById('mt-form');

      function personRowHtml(grupoIdx, p) {
        p = p || { nome: '', atual: null, metas: [null, null, null] };
        return '<div class="mt-person-row">' +
          '<input class="form-input mt-pf-nome" type="text" placeholder="Nome" value="' + (p.nome || '').replace(/"/g, '&quot;') + '">' +
          '<input class="form-input mt-pf-atual" type="number" placeholder="0" value="' + (p.atual != null ? p.atual : '') + '">' +
          '<input class="form-input mt-pf-m1" type="number" placeholder="0" value="' + (p.metas[0] != null ? p.metas[0] : '') + '">' +
          '<input class="form-input mt-pf-m2" type="number" placeholder="0" value="' + (p.metas[1] != null ? p.metas[1] : '') + '">' +
          '<input class="form-input mt-pf-m3" type="number" placeholder="0" value="' + (p.metas[2] != null ? p.metas[2] : '') + '">' +
          '<button type="button" class="mt-remove-person" title="Remover">✕</button>' +
        '</div>';
      }

      function fillForm() {
        document.getElementById('mt-f-mes').value = config.mesRef;
        document.getElementById('mt-f-dia').value = config.diaAtual;
        document.getElementById('mt-f-diasmes').value = config.diasNoMes;
        [0, 1].forEach(function (gi) {
          document.getElementById('mt-f-people-' + gi).innerHTML = config.grupos[gi].pessoas.map(function (p) { return personRowHtml(gi, p); }).join('');
        });
      }

      function openModal() { fillForm(); modal.classList.add('open'); }
      function closeModal() { modal.classList.remove('open'); }
      window.openModal = openModal;

      document.getElementById('mt-gear').addEventListener('click', openModal);
      document.getElementById('mt-add-top').addEventListener('click', openModal);
      closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

      document.querySelectorAll('.mt-add-person').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var gi = btn.getAttribute('data-grupo');
          document.getElementById('mt-f-people-' + gi).insertAdjacentHTML('beforeend', personRowHtml(gi, null));
        });
      });

      form.addEventListener('click', function (e) {
        if (e.target.classList.contains('mt-remove-person')) {
          e.target.closest('.mt-person-row').remove();
        }
      });

      function readPeople(grupoIdx) {
        var rows = document.getElementById('mt-f-people-' + grupoIdx).querySelectorAll('.mt-person-row');
        var pessoas = [];
        rows.forEach(function (row) {
          var nome = row.querySelector('.mt-pf-nome').value.trim();
          if (!nome) return;
          pessoas.push({
            nome: nome,
            atual: Number(row.querySelector('.mt-pf-atual').value) || 0,
            metas: [
              Number(row.querySelector('.mt-pf-m1').value) || 0,
              Number(row.querySelector('.mt-pf-m2').value) || 0,
              Number(row.querySelector('.mt-pf-m3').value) || 0
            ]
          });
        });
        return pessoas;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        config.mesRef = document.getElementById('mt-f-mes').value.trim() || config.mesRef;
        config.diaAtual = Number(document.getElementById('mt-f-dia').value) || 1;
        config.diasNoMes = Number(document.getElementById('mt-f-diasmes').value) || 30;
        config.grupos[0].pessoas = readPeople(0);
        config.grupos[1].pessoas = readPeople(1);
        saveConfig(config);
        render();
        closeModal();
      });

      document.getElementById('mt-restore').addEventListener('click', function () {
        if (!confirm('Restaurar os valores padrão? Isso apaga os ajustes salvos neste navegador.')) return;
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        config = cloneDefault();
        render();
        fillForm();
      });
    </script>
  </body>
</html>
