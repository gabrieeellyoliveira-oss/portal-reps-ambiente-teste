<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Clientes — Portal Bibly | Cardápio Web</title>
    <link rel="icon" type="image/jpeg" href="/assets/cw-logo-dark-e78e4446.jpg">
    <link rel="stylesheet" href="/assets/application-cc2f1a53.css" />
    <style>
      .avatar-circle{width:34px;height:34px;border-radius:50%;background:#5b21b6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
      .clients-avatar{width:30px;height:30px;border-radius:50%;background:#ede9fe;color:#5b21b6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;}
      .clients-name-cell{display:flex;align-items:center;gap:8px;}
    </style>
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="main-wrapper">
        <header class="top-header" id="top-header"></header>
        <main class="page-content">
          <div class="clients-page">
            <div class="cv-header">
              <div class="cv-header-left"><h1 class="cv-title">Clientes</h1><span class="cv-total-badge">275</span></div>
              <div class="cv-header-right">
                <button class="btn btn-sm btn-outline">↻ <span>Sincronizar</span></button>
                <button class="btn btn-sm btn-export-xlsx">⬇ <span class="export-btn-text">Exportar Excel</span></button>
                <div class="cv-view-toggle">
                  <button class="cv-vbtn active" onclick="showView('tabela')">☰ Tabela</button>
                  <button class="cv-vbtn" onclick="showView('kanban')">▦ Kanban</button>
                  <button class="cv-vbtn" onclick="showView('stats')">📊 Estatísticas</button>
                </div>
                <button class="btn btn-primary btn-sm" style="background:#16a34a;">+ Nova Assinatura</button>
              </div>
            </div>
            <div class="cv-status-bar" id="statusbar"></div>
            <div class="clients-toolbar">
              <div class="clients-filters">
                <div class="clients-search-input-wrap">🔍 <input class="clients-search-input" placeholder="Buscar por nome, email ou telefone..."></div>
                <select class="form-input clients-rep-select"><option>Todos Representantes</option></select>
              </div>
            </div>
            <div class="dash-card" id="view-tabela">
              <table class="clients-table" style="width:100%;">
                <thead><tr><th>Cliente</th><th>Assinatura</th><th>Mensalidade</th><th>Comissão</th><th>Fatura</th><th>Representante</th><th>Cidade</th><th class="text-center">Ações</th></tr></thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
            <div class="cv-kanban-board" id="view-kanban" style="display:none;"></div>
            <div id="view-stats" style="display:none;">
              <div class="cv-stats-grid" id="statsGrid"></div>
              <div class="clients-chart-row">
                <div class="dash-card clients-chart-card">
                  <h3 class="section-title">Novos Clientes por Mês</h3>
                  <div class="chart-bars-placeholder" style="display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px;">
                    <div style="flex:1;background:#7c3aed;height:20%;border-radius:4px 4px 0 0;"></div>
                    <div style="flex:1;background:#7c3aed;height:35%;border-radius:4px 4px 0 0;"></div>
                    <div style="flex:1;background:#7c3aed;height:55%;border-radius:4px 4px 0 0;"></div>
                    <div style="flex:1;background:#7c3aed;height:70%;border-radius:4px 4px 0 0;"></div>
                    <div style="flex:1;background:#7c3aed;height:90%;border-radius:4px 4px 0 0;"></div>
                    <div style="flex:1;background:#7c3aed;height:60%;border-radius:4px 4px 0 0;"></div>
                  </div>
                </div>
                <div class="dash-card clients-city-ranking-card">
                  <h3 class="section-title">Top Cidades</h3>
                  <div id="topCities"></div>
                  <a href="#" style="font-size:.78rem;">Ver todas as cidades →</a>
                </div>
                <div class="dash-card clients-city-ranking-card">
                  <h3 class="section-title">Top Estados</h3>
                  <div id="topStates"></div>
                  <a href="#" style="font-size:.78rem;">Ver todos os estados →</a>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="/assets/fakedata.js"></script>
    <script src="/assets/shell.js" data-title="Clientes"></script>
    <script>
      var SPILLS = [
        {icon:'', label:'Todos', n:275, active:true},
        {icon:'✅ ', label:'Ativas', n:195},
        {icon:'💳 ', label:'Fatura Aberta', n:122},
        {icon:'🔴 ', label:'Inadimplentes', n:72},
        {icon:'', label:'Canceladas', n:55},
        {icon:'', label:'Abandono', n:25},
        {icon:'📝 ', label:'Manuais', n:0}
      ];
      document.getElementById('statusbar').innerHTML = SPILLS.map(function (s) {
        return '<a class="cv-spill' + (s.active?' active':'') + '"><span class="cv-spill-dot"></span>' + s.icon + s.label + ' <span class="cv-spill-n">' + s.n + '</span></a>';
      }).join('');

      var ROWS = [
        {name:'Pizza Napolitana Real', plan:'Ativa', planTag:'Plano Premium (Mesas + Delivery)', mensal:'R$ 299,98', comissao:'—', fatura:'Em dia', rep:'Rodrigo Almeida Santos', city:'—'},
        {name:'Império Burger House', plan:'Ativa', planTag:'Plano Delivery', mensal:'R$ 209,99', comissao:'—', fatura:'Em dia', rep:'Rodrigo Almeida Santos', city:'—'},
        {name:'Novo Burguer Artesanal', plan:'Abandono', planTag:'Plano Premium (Mesas + Delivery)', mensal:'R$ 369,97', comissao:'R$ 147,99', fatura:'R$ 369,97 vence 20/08', rep:'Elias Fontoura', city:'Carpina / PE'},
        {name:'Comida Rápida Express', plan:'Ativa', planTag:'Plano Delivery', mensal:'R$ 209,99', comissao:'R$ 84,00', fatura:'Em dia', rep:'Diego Martins Rocha', city:'—'},
        {name:'Sabor da Casa Resto', plan:'Ativa', planTag:'Plano Delivery', mensal:'R$ 209,99', comissao:'R$ 84,00', fatura:'Em dia', rep:'Diego Martins Rocha', city:'—'},
        {name:'Divina Cozinha Restaurante', plan:'Ativa', planTag:'Plano Delivery', mensal:'R$ 209,99', comissao:'R$ 84,00', fatura:'Em dia', rep:'Diego Martins Rocha', city:'—'},
        {name:'Pizzaria Nova Estrela', plan:'Ativa', planTag:'Plano Delivery', mensal:'R$ 239,98', comissao:'—', fatura:'Em dia', rep:'Vitor Freitas Fernandes', city:'Osasco / SP'}
      ];
      // Completa para o total real de 275 clientes (195 Ativa, 25 Abandono, 55 Cancelada) com dados ficticios
      var PLAN_TAGS = ['Plano Delivery','Plano Mesas','Plano Premium (Mesas + Delivery)'];
      var PLAN_PRICE = {'Plano Delivery':'R$ 209,99','Plano Mesas':'R$ 169,99','Plano Premium (Mesas + Delivery)':'R$ 269,99'};
      var PLAN_TARGETS = [{plan:'Ativa', target:195}, {plan:'Abandono', target:25}, {plan:'Cancelada', target:55}];
      PLAN_TARGETS.forEach(function (spec) {
        var have = ROWS.filter(function (r) { return r.plan === spec.plan; }).length;
        for (var i = 0; have + i < spec.target; i++) {
          var idx = 4000 + PLAN_TARGETS.indexOf(spec) * 300 + i;
          var city = FakeData.genCity(idx);
          var tag = PLAN_TAGS[idx % PLAN_TAGS.length];
          ROWS.push({
            name: FakeData.genBiz(idx), plan: spec.plan, planTag: tag, mensal: PLAN_PRICE[tag],
            comissao: (idx % 3 === 0) ? '—' : 'R$ ' + (60 + idx % 40) + ',00',
            fatura: spec.plan === 'Ativa' ? 'Em dia' : (spec.plan === 'Abandono' ? PLAN_PRICE[tag] + ' vence ' + (10 + idx % 18) + '/' + (1 + idx % 12) : '—'),
            rep: FakeData.genPerson(idx + 500), city: city[0] + ' / ' + city[1]
          });
        }
      });
      var tbody = document.getElementById('tbody');
      ROWS.forEach(function (r) {
        var initials = r.name.split(' ').slice(0,2).map(function(w){return w[0];}).join('').toUpperCase();
        var badgeCls = r.plan === 'Ativa' ? 'status-badge status-active' : 'status-badge';
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><div class="clients-name-cell"><div class="clients-avatar">' + initials + '</div><div><div class="clients-name" style="font-weight:600;">' + r.name + '</div><div style="color:var(--cw-gray-500);font-size:.75rem;">' + r.city + '</div></div></div></td>' +
          '<td><span class="' + badgeCls + '">' + r.plan + '</span><div style="color:var(--cw-gray-500);font-size:.72rem;margin-top:2px;">' + r.planTag + '</div></td>' +
          '<td><span class="clients-value">' + r.mensal + '</span></td>' +
          '<td><span class="clients-value">' + r.comissao + '</span></td>' +
          '<td>' + r.fatura + '</td>' +
          '<td><span class="clients-rep-badge">👤 ' + r.rep + '</span></td>' +
          '<td>' + r.city + '</td>' +
          '<td class="text-center"><div class="clients-actions"><a class="clients-action-btn">👁</a><a class="clients-action-btn">✎</a></div></td>';
        tbody.appendChild(tr);
      });

      function showView(v) {
        document.querySelectorAll('.cv-vbtn').forEach(function (b, i) {
          b.classList.toggle('active', (v==='tabela'&&i===0)||(v==='kanban'&&i===1)||(v==='stats'&&i===2));
        });
        document.getElementById('view-tabela').style.display = v === 'tabela' ? '' : 'none';
        document.getElementById('view-kanban').style.display = v === 'kanban' ? '' : 'none';
        document.getElementById('view-stats').style.display = v === 'stats' ? '' : 'none';
      }

      var KANBAN = [
        {status:'Pendente', count:2, cards:[
          {name:'Frangão do Bairro', val:'R$ 209,99', rep:'Rafael Patrício Ferreira'},
          {name:'Pizzaria Della Roma Unidade Ceilândia', val:'R$ 239,98', rep:'Filipe Sales Freire'}
        ]},
        {status:'Pago', count:195, cards:[
          {name:'Chefs da Obra', val:'R$ 239,98', rep:'Ezequias dos Santos Ferreira Matsudo'},
          {name:'Propp Açaí', val:'R$ 279,98', rep:'Rodrigo Rosa Nunes'},
          {name:'Galeteria e Peixaria Tio Flávio', val:'R$ 209,99', rep:'Isac Augusto Bezerra de Barros'}
        ]},
        {status:'Cancelado', count:54, cards:[
          {name:'Pizzaria Nossa Pizza Osasco', val:'R$ 239,98', rep:'Victor Oliveira de Freitas Fernandes de Assis'},
          {name:'Churrasco do Zé', val:'R$ 269,99', rep:'Marco Aurélio Melo Luna'}
        ]},
        {status:'Desistiu', count:1, cards:[
          {name:'Sushi Love Maracanaú', val:'R$ 209,99', rep:'Rafael Patrício Ferreira'}
        ]}
      ];
      document.getElementById('view-kanban').innerHTML = KANBAN.map(function (col) {
        var cardsHtml = col.cards.map(function (c) {
          return '<div class="kanban-card"><div class="kanban-card__name">' + c.name + '</div><div class="kanban-card__company">' + c.name + '</div>' +
            '<div class="kanban-card__meta"><span>' + c.val + '</span><span class="kanban-card__status">' + col.status + '</span></div>' +
            '<div>👤 ' + c.rep + '</div>' +
            '<div class="kanban-card__actions"><a class="kanban-action-btn">👁</a><a class="kanban-action-btn">✎</a></div></div>';
        }).join('');
        return '<div class="kanban-column"><div class="kanban-column-header"><span>' + col.status + '</span><span>' + col.count + '</span></div>' +
          '<div class="kanban-cards">' + cardsHtml + '</div></div>';
      }).join('');

      var STATS = [
        ['2', 'Pendentes', '0.7%'], ['195', 'Pagos', '70.4%'], ['54', 'Cancelados', '19.5%'], ['1', 'Desistiram', '0.4%'],
        ['277', 'Total', '+14 este mês'], ['161', 'Total de Lojas', '277 clientes']
      ];
      document.getElementById('statsGrid').innerHTML = STATS.map(function (s) {
        return '<div class="cv-stat-card"><div><div class="cv-stat-value">' + s[0] + '</div><div class="cv-stat-label">' + s[1] + '</div></div><div class="cv-stat-pct">' + s[2] + '</div></div>';
      }).join('');

      var CITIES = [['São Luís/MA', 11, 28], ['Fortaleza/CE', 7, 24], ['Luís Eduardo Magalhães/BA', 2, 4], ['Rio Verde/GO', 1, 3], ['São Paulo/SP', 0, 3]];
      document.getElementById('topCities').innerHTML = CITIES.map(function (c, i) {
        return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid #eee;font-size:.82rem;"><span>' + (i+1) + ' ' + c[0] + '</span><span style="color:#9ca3af;">' + c[1] + ' canc. · ' + c[2] + ' pagos</span></div>';
      }).join('');
      var STATES = [['MA', 11, 39], ['CE', 16, 28], ['SP', 3, 9], ['PE', 1, 9], ['BA', 2, 5]];
      document.getElementById('topStates').innerHTML = STATES.map(function (s, i) {
        return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid #eee;font-size:.82rem;"><span>' + (i+1) + ' ' + s[0] + '</span><span style="color:#9ca3af;">' + s[1] + ' canc. · ' + s[2] + ' pagos</span></div>';
      }).join('');
    </script>
  </body>
</html>
