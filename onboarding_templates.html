<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Templates de Onboarding — Portal Bibly | Cardápio Web</title>
    <link rel="icon" type="image/jpeg" href="/assets/cw-logo-dark-e78e4446.jpg">
    <link rel="stylesheet" href="/assets/application-cc2f1a53.css" />
    <style>
      .avatar-circle{width:34px;height:34px;border-radius:50%;background:#5b21b6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
    </style>
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="main-wrapper">
        <header class="top-header" id="top-header"></header>
        <main class="page-content">
          <div class="onb-page-header">

          <div class="onb-templates-grid">
            <div class="onb-template-card">
              <div class="onb-template-card-header">
                <div class="onb-template-status active">Ativo</div>
                <div class="onb-template-actions"><a class="btn-icon-sm">✎</a></div>
              </div>
              <h3 class="onb-template-name">Onboarding de Representante</h3>
              <p class="onb-template-desc"></p>
              <div class="onb-template-stats">
                <div class="onb-template-stat"><span class="stat-value">5</span><span class="stat-label">Seções</span></div>
                <div class="onb-template-stat"><span class="stat-value">33</span><span class="stat-label">Atividades</span></div>
                <div class="onb-template-stat"><span class="stat-value">110</span><span class="stat-label">Matriculados</span></div>
