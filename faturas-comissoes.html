<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Fatura / Comissão — Bibly | Cardápio Web</title>
    <link rel="icon" type="image/jpeg" href="/assets/cw-logo-dark-e78e4446.jpg">
    <link rel="stylesheet" href="/assets/application-cc2f1a53.css" />
    <style>
      .avatar-circle{width:34px;height:34px;border-radius:50%;background:#5b21b6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
      .fc-tabs{display:flex;gap:8px;margin-bottom:14px;}
      .fc-tab { display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:9px;font-size:0.85rem;font-weight:700;color:#6b7280;background:#f3f4f6;text-decoration:none;border:1.5px solid transparent;cursor:pointer; }
      .fc-tab-active { background:#fff;color:#7c3aed;border-color:#7c3aed;box-shadow:0 2px 8px rgba(124,58,237,.14); }
      .fc-filters { display:flex;align-items:center;gap:18px;margin-bottom:16px;flex-wrap:wrap; }
      .fc-filter-group { display:flex;align-items:center;gap:8px; }
      .fc-filter-label{font-size:.72rem;color:#9ca3af;font-weight:700;}
      .fc-segment { display:inline-flex;background:#f3f4f6;border-radius:9px;padding:3px; }
      .fc-seg{border:none;background:transparent;border-radius:7px;padding:6px 14px;font-size:.78rem;font-weight:700;color:#6b7280;cursor:pointer;}
      .fc-seg-on { background:#fff;color:#7c3aed;box-shadow:0 1px 4px rgba(0,0,0,.08); }
      .fc-totals { display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap; }
      .fc-total-card { flex:1;min-width:120px;display:flex;flex-direction:column;gap:2px;background:#fff;border:1.5px solid #e5e7eb;border-radius:12px;padding:12px 16px;text-decoration:none; }
      .fc-total-on { border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.12); }
      .fc-total-money { background:#faf9ff; }
      .fc-total-count{font-size:1.2rem;font-weight:800;color:#1f2937;}
      .fc-total-label{font-size:.7rem;color:#9ca3af;font-weight:700;}
      .fc-empty{border:1px solid #eee;border-radius:12px;padding:60px;text-align:center;color:#9ca3af;}
    </style>
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="main-wrapper">
        <header class="top-header" id="top-header"></header>
        <main class="page-content">
          <div class="reps-tab-bar">
            <a class="fc-tab fc-tab-active" onclick="showTab('saques');return false;">🏦 Saques</a>
            <a class="fc-tab" onclick="showTab('comissoes');return false;">💰 Comissões</a>
          </div>
          <div class="fc-filters">
            <form class="fc-filter-group">
              <label class="fc-filter-label">👤 Representante</label>
              <select class="form-input" id="repSelect"></select>
            </form>
          </div>

          <div id="saques-panel">
            <div class="dash-card">
              <table class="data-table" style="width:100%;">
                <thead><tr><th>Saque</th><th>Valor</th><th>Status</th><th>Pago em</th><th>Comissões incluídas</th><th></th></tr></thead>
                <tbody id="saqueRows"></tbody>
              </table>
            </div>
          </div>

          <div id="comissoes-panel" style="display:none;">
            <div class="fc-totals">
              <a class="fc-total-card fc-total-on"><span class="fc-total-count">20</span><span class="fc-total-label">Todas</span></a>
              <a class="fc-total-card"><span class="fc-total-count">4</span><span class="fc-total-label">Pendente</span></a>
              <a class="fc-total-card"><span class="fc-total-count">0</span><span class="fc-total-label">Processando</span></a>
              <a class="fc-total-card"><span class="fc-total-count">16</span><span class="fc-total-label">Pago</span></a>
              <a class="fc-total-card"><span class="fc-total-count">0</span><span class="fc-total-label">Erro</span></a>
              <div class="fc-total-card fc-total-money"><span class="fc-total-count">R$ 1.546,49</span><span class="fc-total-label">Total Pago no período</span></div>
              <div class="fc-total-card fc-total-money"><span class="fc-total-count">R$ 1.993,71</span><span class="fc-total-label">Total de comissões</span></div>
            </div>
            <div class="dash-card">
              <table class="data-table" style="width:100%;">
                <thead><tr><th>Estabelecimento</th><th>Valor</th><th>Status</th><th>Assinatura</th><th>Próxima fatura do cliente</th><th>Data de liberação</th><th>Data do pagamento</th></tr></thead>
                <tbody id="commRows"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="/assets/fakedata.js"></script>
    <script src="/assets/shell.js" data-title="Fatura / Comissão"></script>
    <script>
      function showTab(t) {
        document.querySelectorAll('.fc-tab').forEach(function(el,i){ el.classList.toggle('fc-tab-active', (t==='saques'&&i===0)||(t==='comissoes'&&i===1)); });
        document.getElementById('saques-panel').style.display = t === 'saques' ? '' : 'none';
        document.getElementById('comissoes-panel').style.display = t === 'comissoes' ? '' : 'none';
      }
      var REPS = ['Adiel Bruno Santos de Melo (#22249)','Alessandro Rodrigues da Silva (#16804)','Alex Salomão dos Anjos (#23273)','Alexssander Rodrigo de Oliveira (#20402)','Alisson Gomes dos Santos (#23272)','Anderson Rodrigo Andrade do Nascimento (#21787)','André Ângelo Ferreira da Silva (#22484)','Andre Luis Magrini Tietz (#25648)','Antonio Jean da Silva (#22250)','Marco Aurélio Melo Luna (#16408)'];
      // Completa até o total real de 121 representantes com dados fictícios gerados
      for (var ri = 0; REPS.length < 121; ri++) {
        var idx = 6000 + ri;
        REPS.push(FakeData.genPerson(idx) + ' (#' + (17000 + idx % 9000) + ')');
      }
      document.getElementById('repSelect').innerHTML = REPS.map(function(r){ return '<option' + (r.indexOf('Marco Aurélio')===0 ? ' selected' : '') + '>'+r+'</option>'; }).join('');

      var COMM_ROWS = [
        {biz:'Grill do Vale | Vila Nova República', val:'R$ 147,99', status:'Pendente', fatura:'✓ Em dia', liber:'10/09/2026', pag:'Não pago'},
        {biz:'Pão de Alho do Zé | Cohab Anil IV', val:'R$ 17,80', status:'Pendente', fatura:'✓ Em dia', liber:'10/09/2026', pag:'Não pago'},
        {biz:'Folks Burger', val:'R$ 135,99', status:'Pendente', fatura:'✓ Em dia', liber:'10/09/2026', pag:'Não pago'},
        {biz:'Bravus Hambúrgueria', val:'R$ 145,44', status:'Pendente', fatura:'✓ Em dia', liber:'10/09/2026', pag:'Não pago'},
        {biz:'Santo Toro Burger', val:'R$ 119,99', status:'Pago', fatura:'✓ Em dia', liber:'09/09/2026', pag:'10/09/2026'},
        {biz:'Frazão Burguer Grill', val:'R$ 84,00', status:'Pago', fatura:'✓ Em dia', liber:'09/09/2026', pag:'10/09/2026'},
        {biz:'Pepê Burger | Cohatrac I', val:'R$ 95,99', status:'Pago', fatura:'✓ Em dia', liber:'08/09/2026', pag:'10/09/2026'},
        {biz:'Oi Churros | Newton Bello', val:'R$ 155,98', status:'Pago', fatura:'✓ Em dia', liber:'08/09/2026', pag:'10/09/2026'},
        {biz:'Burger & Cream Cohatrac', val:'R$ 4,40', status:'Pago', fatura:'16/09/2026 ⏳ vence já R$ 354,97', liber:'08/09/2026', pag:'10/09/2026'},
        {biz:'Dom Marmita', val:'R$ 37,80', status:'Pago', fatura:'✓ Em dia', liber:'07/09/2026', pag:'10/09/2026'},
        {biz:'Yallah | Culinária Árabe', val:'R$ 145,98', status:'Pago', fatura:'✓ Em dia', liber:'06/09/2026', pag:'10/09/2026'}
      ];
      document.getElementById('commRows').innerHTML = COMM_ROWS.map(function (r) {
        var statusColor = r.status === 'Pago' ? 'status-active' : '';
        return '<tr><td>' + r.biz + '</td><td>' + r.val + '</td>' +
          '<td><span class="status-badge ' + statusColor + '">' + r.status + '</span></td>' +
          '<td>🔗 Ativa</td><td>' + r.fatura + '</td><td>' + r.liber + '</td><td>' + r.pag + '</td></tr>';
      }).join('');

      var SAQUE_ROWS = [
        {id:'01a08bea…', val:'R$ 5.116,62', pago:'10/09/2026', qtd:45},
        {id:'019ff90d…', val:'R$ 440,30', pago:'12/08/2026', qtd:3},
        {id:'019fecd2…', val:'R$ 5.129,41', pago:'10/08/2026', qtd:43},
        {id:'a41bfdee…', val:'R$ 4.929,41', pago:'10/07/2026', qtd:44},
        {id:'8b05c646…', val:'R$ 2.676,25', pago:'10/06/2026', qtd:24},
        {id:'5b4e9af5…', val:'R$ 492,62', pago:'11/05/2026', qtd:6}
      ];
      document.getElementById('saqueRows').innerHTML = SAQUE_ROWS.map(function (s) {
        return '<tr><td>🏦 Programa de parcerias recorrente Cardápio Web ' + s.id + '</td><td>' + s.val + '</td>' +
          '<td><span class="status-badge status-active">Concluído</span></td><td>' + s.pago + '</td>' +
          '<td>💰 ' + s.qtd + ' pagamentos</td><td><a href="#">Ver detalhes →</a></td></tr>';
      }).join('');
    </script>
  </body>
</html>
